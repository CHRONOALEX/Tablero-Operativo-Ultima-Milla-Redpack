<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI's UM Redpack</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.1.0"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #181818;
            --text-main: #e0e0e0;
            --accent-efi: #4fc3f7; /* Celeste */
            --accent-vis: #ffb74d; /* Naranja */
            --border: #2d2d2d;
            --success: #00e676;
            --danger: #ff5252;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
        }

        /* Título Presentable */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .title-wrapper h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-wrapper span {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Botón Subir Estilizado */
        .btn-upload-container {
            position: relative;
            overflow: hidden;
        }
        .btn-upload-custom {
            background: transparent;
            border: 1px solid #444;
            color: #fff;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        .btn-upload-custom:hover {
            background: #fff;
            color: #000;
        }
        #fileInput {
            position: absolute;
            left: 0; top: 0; opacity: 0;
            cursor: pointer;
            height: 100%; width: 100%;
        }

        /* Layout Grid */
        .main-layout {
            display: grid;
            grid-template-columns: 450px 1fr;
            gap: 25px;
            display: none; /* Se activa al cargar archivo */
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Tabla */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; padding: 12px 8px; color: #555; border-bottom: 1px solid var(--border); }
        td { padding: 12px 8px; border-bottom: 1px solid #222; }

        /* Colores de Referencia en Tabla */
        .col-vis { color: var(--accent-vis) !important; font-weight: bold; }
        .col-efi { color: var(--accent-efi) !important; font-weight: bold; }
        
        /* Semáforo condicional (BG) */
        .status-pill {
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .bg-red { background: rgba(255, 82, 82, 0.15); color: var(--danger); }
        .bg-green { background: rgba(0, 230, 118, 0.15); color: var(--success); }

        .btn-copy {
            background: #222;
            border: 1px solid #333;
            color: #ccc;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-copy:hover { background: #333; }

        .chart-container { height: 500px; }
    </style>
</head>
<body>

<div class="app-header">
    <div class="title-wrapper">
        <span>LOGISTICS DASHBOARD</span>
        <h1>KPI's UM Redpack</h1>
    </div>
    <div class="btn-upload-container">
        <button class="btn-upload-custom">Cargar Excel / CSV</button>
        <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" />
    </div>
</div>

<div id="mainLayout" class="main-layout">
    <div class="card">
        <div class="card-title">
            Cumplimiento Entregas Rombo
            <button class="btn-copy" onclick="copyToSheets()">Copiar Datos</button>
        </div>
        <div class="table-container">
            <table id="kpiTable">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Total</th>
                        <th>N.E.</th>
                        <th>TR2</th>
                        <th class="col-vis">% Visita</th>
                        <th class="col-efi">% Efi.</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <div class="chart-container">
            <canvas id="mainChart"></canvas>
        </div>
    </div>
</div>

<script>
    let chartInstance = null;

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            const data = new Uint8Array(evt.target.result);
            const wb = XLSX.read(data, { type: 'array' });
            const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            renderDashboard(json);
        };
        reader.readAsArrayBuffer(file);
    });

    function renderDashboard(data) {
        document.getElementById('mainLayout').style.display = 'grid';
        const resumen = {};
        
        data.forEach(row => {
            let f = row['Fecha Jornada'] ? row['Fecha Jornada'].toString().split(' ')[0] : 'S/F';
            if (!resumen[f]) resumen[f] = { e: 0, ne: 0, tr2: 0 };
            const desc = (row['Descripcion'] || "").trim().toUpperCase();
            if (desc === "ENTREGADO") resumen[f].e++;
            else if (desc === "NO ENTREGADO") resumen[f].ne++;
            else if (desc === "NO EMBARCADO TR2") resumen[f].tr2++;
        });

        const fechas = Object.keys(resumen).sort();
        const tbody = document.querySelector('#kpiTable tbody');
        tbody.innerHTML = '';

        const chartData = { labels: [], efi: [], vis: [] };

        fechas.forEach(f => {
            const d = resumen[f];
            const total = d.e + d.ne + d.tr2;
            const visita = d.e + d.ne;
            const pVisita = total > 0 ? (visita / total * 100) : 0;
            const pEfi = total > 0 ? (d.e / total * 100) : 0;

            chartData.labels.push(f);
            chartData.vis.push(pVisita.toFixed(2));
            chartData.efi.push(pEfi.toFixed(2));

            const classVis = pVisita >= 98 ? 'bg-green' : 'bg-red';
            const classEfi = pEfi >= 98 ? 'bg-green' : 'bg-red';

            tbody.innerHTML += `
                <tr>
                    <td>${f}</td>
                    <td>${total}</td>
                    <td>${d.ne}</td>
                    <td>${d.tr2}</td>
                    <td><span class="status-pill col-vis ${classVis}">${pVisita.toFixed(1)}%</span></td>
                    <td><span class="status-pill col-efi ${classEfi}">${pEfi.toFixed(1)}%</span></td>
                </tr>
            `;
        });

        initChart(chartData);
    }

    function initChart(data) {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.labels,
                datasets: [
                    {
                        label: '% Eficiencia (Celeste)',
                        data: data.efi,
                        borderColor: '#4fc3f7',
                        backgroundColor: 'rgba(79, 195, 247, 0.1)',
                        tension: 0.3,
                        borderWidth: 3,
                        pointRadius: 4,
                        fill: true
                    },
                    {
                        label: '% Visita (Naranja)',
                        data: data.vis,
                        borderColor: '#ffb74d',
                        backgroundColor: 'transparent',
                        tension: 0.3,
                        borderWidth: 2,
                        borderDash: [5, 5],
                        pointRadius: 3
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { 
                        min: 80, max: 100,
                        grid: { color: '#222' },
                        ticks: { color: '#666' }
                    },
                    x: { grid: { display: false }, ticks: { color: '#666' } }
                },
                plugins: {
                    legend: { position: 'top', labels: { color: '#fff', font: { size: 12 } } },
                    annotation: {
                        annotations: {
                            line1: {
                                type: 'line', yMin: 98, yMax: 98,
                                borderColor: '#ff5252', borderWidth: 2,
                                label: {
                                    display: true, content: 'Cumplimiento Amazon 98%',
                                    backgroundColor: '#ff5252', color: '#fff', font: { size: 10 }
                                }
                            }
                        }
                    }
                }
            }
        });
    }

    function copyToSheets() {
        let text = "";
        const rows = document.querySelectorAll("#kpiTable tr");
        rows.forEach(row => {
            const cols = row.querySelectorAll("th, td");
            const rowData = Array.from(cols).map(c => c.innerText.replace('%', ''));
            text += rowData.join("\t") + "\n";
        });
        navigator.clipboard.writeText(text).then(() => alert("Copiado al portapapeles. Pega en Google Sheets con Ctrl+V."));
    }
</script>
</body>
</html>
